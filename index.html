<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="기계 요소를 블록처럼 연결해 운동의 전달·변환과 코딩 개념을 함께 익히는 2D 시뮬레이터">
<title>오토마타 모듈 시뮬레이터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23F2B705' stroke='%231F2A33' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FBFCFA' stroke='%231F2A33' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6ECE5; --panel:#F6F8F5; --plate:#FBFCFA; --ink:#1F2A33; --muted:#5E6B74;
  --line:#C9D2CD; --accent:#F2B705; --rot:#2F6FDE; --lin:#D9730D; --danger:#B23A2E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--panel);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--rot);outline-offset:1px}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;font-size:16px;margin-right:10px;letter-spacing:-0.01em}
.brand small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
#btnPlay{background:var(--accent);border-color:#C99700;font-weight:600;min-width:92px}
.grp{display:flex;align-items:center;gap:6px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#speedVal{min-width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
main{display:grid;grid-template-columns:196px 1fr 310px;min-height:0}
#palette{overflow:auto;border-right:1px solid var(--line);padding:10px}
.cat{margin:4px 0 12px}
.cat h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.cat h4 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.pal{display:block;width:100%;text-align:left;margin-bottom:5px;padding:6px 8px;background:#fff}
.pal b{font-weight:600;display:block;font-size:13px}
.pal span{font-size:11px;color:var(--muted)}
#stageWrap{position:relative;min-width:0;min-height:0;background:var(--paper)}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:rgba(246,248,245,.9);padding:3px 8px;border-radius:4px;pointer-events:none}
#zoom{position:absolute;right:10px;bottom:8px;display:flex;gap:4px}
#zoom button{padding:4px 9px;background:rgba(255,255,255,.92)}
#side{overflow:auto;border-left:1px solid var(--line);padding:12px 14px}
#side h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600}
.ptitle{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.ptitle i{width:12px;height:12px;border-radius:3px}
.concept{display:inline-block;margin:6px 0 2px;padding:2px 8px;border-radius:999px;background:#FFF3C4;font-size:12px;font-weight:600}
.desc{color:var(--muted);line-height:1.55;margin:8px 0}
.io{font-size:12px;margin:6px 0 10px}
.field{margin:10px 0}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.field label output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%}
.field input[type=text],.field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.field.check label{justify-content:flex-start;gap:8px;color:var(--ink);font-size:13px}
#pinfo{font-size:12px;line-height:1.5;padding:8px 10px;background:#EEF2EE;border-radius:6px;margin:10px 0}
#pinfo:empty{display:none}
.danger{color:var(--danger);border-color:#E3B8B3;margin-top:6px}
.help ol{padding-left:18px;margin:6px 0;line-height:1.7}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}
.legend span{display:flex;align-items:center;gap:5px}
.shape{display:inline-block;width:11px;height:11px;border:2px solid}
.shape.rot{border-radius:50%;border-color:var(--rot)}
.shape.lin{border-color:var(--lin)}
.shape.any{transform:rotate(45deg) scale(.85);border-color:#7A838C}
#code{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12px;line-height:1.55;background:#1F2A33;color:#E8EEF2;border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:0}
#code .cm{color:#9FB3A5}
#warn{font-size:12px;line-height:1.5}
#warn div{padding:5px 8px;border-radius:5px;background:#FBEAE7;color:#8A2C22;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(31,42,51,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.card{background:#fff;border-radius:10px;padding:18px;width:min(520px,92vw);max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.card h2{margin:0 0 12px;font-size:17px}
.card textarea{width:100%;height:240px;font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px}
.card input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.mbtns .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.dlist div{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #EEF1EF}
.dlist div b{flex:1;font-weight:600}
.dlist small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;max-width:min(560px,90vw);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;line-height:1.5}
#toast.show{opacity:1}
@media (max-width:980px){
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(360px,1fr) auto}
  #palette{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:10px;overflow-x:auto;padding:8px}
  .cat{margin:0;min-width:150px}
  #side{border-left:0;border-top:1px solid var(--line);max-height:45vh}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">오토마타 모듈 2D<small>기계 요소를 블록처럼 연결하기</small></div>
    <div class="grp">
      <button id="btnPlay">⏸ 멈추기</button>
      <button id="btnStep" title="0.1초 진행">한 걸음</button>
      <button id="btnReset" title="시간을 0으로">처음으로</button>
      <label class="grp">속도 <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1"></label>
      <span id="speedVal">×1.0</span>
    </div>
    <div class="sep"></div>
    <select id="exSel"><option value="">예제 불러오기…</option></select>
    <div class="sep"></div>
    <div class="grp">
      <button id="btnSave">저장</button>
      <button id="btnLoad">불러오기</button>
      <button id="btnJson">JSON</button>
      <button id="btnClear">모두 지우기</button>
    </div>
  </header>
  <main>
    <aside id="palette"></aside>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="status">모듈을 끌어다 놓거나 눌러서 추가하세요</div>
      <div id="zoom"><button id="zOut" aria-label="축소">−</button><button id="zFit">맞춤</button><button id="zIn" aria-label="확대">+</button></div>
    </div>
    <aside id="side">
      <section id="props"></section>
      <h3>번역 코드</h3>
      <pre id="code"></pre>
      <h3>점검</h3>
      <section id="warn"></section>
    </aside>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><div class="mbtns" id="mBtns"></div></div></div>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   기본 상수와 도우미
   ===================================================================== */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const HEAD = 26, GRID = 20, W = 180, H = 140, HI = 10; // HI: 논리 1 = 10mm
const INK = '#1F2A33', MUTED = '#5E6B74', PLATE = '#FBFCFA', SEL = '#F2B705';
const FONT = '"IBM Plex Sans KR","Malgun Gothic",sans-serif';
const CAT = {
  src:   { n: '동력원',   c: '#B23A2E' },
  trans: { n: '전달 (회전 → 회전)', c: '#3E5C76' },
  conv:  { n: '변환 (운동의 형태 바꾸기)', c: '#2E7D5B' },
  logic: { n: '논리 (직선 신호 0/1)', c: '#6A4C93' },
  out:   { n: '출력과 관찰', c: '#56606B' }
};
const SIG = { rot: { n: '회전', c: '#2F6FDE' }, lin: { n: '직선', c: '#D9730D' }, any: { n: '아무거나', c: '#7A838C' } };
const mod360 = a => ((a % 360) + 360) % 360;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const bit = v => v != null && v >= HI / 2;
const P = (cx, cy, r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)]; // 수학 좌표(반시계 +)

function line(c, x1, y1, x2, y2, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function circ(c, x, y, r, fill, stroke, w) { c.beginPath(); c.arc(x, y, Math.max(0.5, r), 0, TAU); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = w || 1.5; c.stroke(); } }
function joint(c, x, y) { circ(c, x, y, 3.2, '#fff', INK, 1.4); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function txt(c, s, x, y, size, col, align, weight) { c.font = `${weight || 400} ${size}px ${FONT}`; c.fillStyle = col; c.textAlign = align || 'left'; c.textBaseline = 'middle'; c.fillText(s, x, y); }
function ground(c, x, y) { c.fillStyle = '#C9D2CD'; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 7, y + 10); c.lineTo(x + 7, y + 10); c.closePath(); c.fill(); }

function gear(c, cx, cy, r, z, deg, fill) {
  const s = Math.PI / z, t = Math.max(1.4, Math.min(r * 0.15, Math.PI * r / z * 0.55)), a0 = deg * D2R;
  c.beginPath();
  for (let i = 0; i < z; i++) {
    const a = a0 + i * 2 * s;
    [[a - 0.5 * s, r - t], [a - 0.22 * s, r + t], [a + 0.22 * s, r + t], [a + 0.5 * s, r - t]].forEach(([aa, rr_], k) => {
      const [x, y] = P(cx, cy, rr_, aa); (i === 0 && k === 0) ? c.moveTo(x, y) : c.lineTo(x, y);
    });
  }
  c.closePath(); c.fillStyle = fill; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.1; c.stroke();
  circ(c, cx, cy, Math.max(2, r * 0.2), '#fff', INK, 1.1);
  const [mx, my] = P(cx, cy, r * 0.6, a0); circ(c, mx, my, Math.max(1.6, r * 0.09), INK);
}

/* ---------- 메커니즘 수식 ---------- */
function camLift(p, deg) {
  const f = mod360(deg), Hh = p.H;
  switch (p.shape) {
    case 'ecc':   return Hh * (1 - Math.cos(f * D2R)) / 2;
    case 'heart': return f < 180 ? Hh * f / 180 : Hh * (360 - f) / 180;
    case 'snail': return Hh * f / 360;
    default: {
      const rel = mod360(f - p.start), Wd = p.width, r = Math.min(20, Wd / 3);
      if (rel >= Wd) return 0;
      let k = 1; if (rel < r) k = rel / r; else if (rel > Wd - r) k = (Wd - rel) / r;
      return Hh * k * k * (3 - 2 * k);
    }
  }
}
function genevaOut(n, deg) {
  const a = TAU / n, lam = Math.sin(Math.PI / n), half = Math.PI / 2 - Math.PI / n;
  const th = deg * D2R, k = Math.floor(th / TAU), ph = th - k * TAU - Math.PI;
  let u;
  if (ph <= -half) u = k * a;
  else if (ph >= half) u = (k + 1) * a;
  else u = k * a + a / 2 + Math.atan2(lam * Math.sin(ph), 1 - lam * Math.cos(ph));
  return -u / D2R; // 제네바 휠은 반대 방향으로 돈다
}
function fourbarSolve(p, deg) {
  const { a, b, c: cc, d } = p, th = deg * D2R;
  const Ax = a * Math.cos(th), Ay = a * Math.sin(th);
  const dx = d - Ax, dy = -Ay, D = Math.hypot(dx, dy);
  if (D > b + cc || D < Math.abs(b - cc) || D === 0) return null;
  const aa = (b * b - cc * cc + D * D) / (2 * D), h = Math.sqrt(Math.max(0, b * b - aa * aa));
  const px = Ax + aa * dx / D, py = Ay + aa * dy / D;
  const Bx = px - h * dy / D, By = py + h * dx / D;
  return { ang: Math.atan2(By, Bx - d) / D2R, Ax, Ay, Bx, By };
}
function crankX(r, L, deg) { const th = deg * D2R; return r * Math.cos(th) + Math.sqrt(Math.max(0, L * L - r * r * Math.sin(th) ** 2)); }

/* ---------- 운동 판정 ---------- */
function classify(buf, type) {
  if (buf.length < 90) return '측정 중…';
  let min = Infinity, max = -Infinity; buf.forEach(v => { min = Math.min(min, v); max = Math.max(max, v); });
  if (max - min < 1e-3) return '정지';
  if (type === 'lin') { const u = new Set(buf.map(v => Math.round(v * 10))); if (u.size <= 2) return '논리 신호 (0 ↔ 1)'; }
  const v = []; for (let i = 1; i < buf.length; i++) v.push(buf[i] - buf[i - 1]);
  const maxA = Math.max(...v.map(Math.abs)); if (maxA < 1e-7) return '정지';
  const eps = maxA * 0.06; let dwell = 0, pos = 0, neg = 0, flips = 0, last = 0;
  v.forEach(x => { if (Math.abs(x) < eps) { dwell++; return; } const s = Math.sign(x); s > 0 ? pos++ : neg++; if (last && s !== last) flips++; last = s; });
  const df = dwell / v.length, rot = type === 'rot';
  if (flips >= 1 && pos > 1 && neg > 1) return (rot ? '요동 운동 (흔들기)' : '직선 왕복 운동') + (df > 0.2 ? ' + 멈춤 구간' : '');
  if (df > 0.2) return rot ? '간헐 운동 (끊어서 회전)' : '간헐 직선 운동 (끊어서 이동)';
  return rot ? '연속 회전 운동' : '한 방향 직선 운동';
}

/* =====================================================================
   모듈 정의 (표준 블록)
   - ins/outs: 표준 축. rot = 회전축(●), lin = 직선축(■), any(◆)
   - eval: 입력값 → 출력값 (회전은 도°, 직선은 mm)
   - code: 번역 코드 한 줄 + 설명
   ===================================================================== */
const DEFS = {
  motor: { name: '모터 (손잡이)', base: '모터', cat: 'src', concept: '시작점 main()', w: 170, h: 130, ins: [], outs: [{ n: '출력축', t: 'rot' }],
    desc: '모든 움직임의 시작점입니다. 일정한 속도로 축을 돌립니다.',
    params: [{ k: 'rpm', l: '회전 속도 (rpm)', min: 1, max: 120, step: 1, d: 20 }, { k: 'dir', l: '방향', type: 'select', o: [[1, '반시계 (+)'], [-1, '시계 (−)']], d: 1 }],
    eval: (m, i, t) => [m.p.rpm * 6 * t * m.p.dir],
    code: (m, i, n) => [`${n} = ${m.p.dir < 0 ? '-' : ''}${m.p.rpm} * 6 * t`, `동력 시작: 1분에 ${m.p.rpm}바퀴 (각도, °)`],
    draw(c, m, b) {
      const v = m.outV[0] ?? 0, r = Math.min(b.h, b.w) * 0.4;
      circ(c, b.cx, b.cy, r, '#F3E3DF', INK, 1.4);
      const [x, y] = P(b.cx, b.cy, r * 0.78, v * D2R);
      line(c, b.cx, b.cy, x, y, INK, 5); circ(c, x, y, 6, CAT.src.c, INK, 1.2); circ(c, b.cx, b.cy, 4, '#fff', INK, 1.2);
      txt(c, `${m.p.rpm} rpm`, b.x + b.w, b.y + 8, 11, MUTED, 'right');
    } },

  gear: { name: '기어 쌍', base: '기어', cat: 'trans', concept: '곱셈 ×', ins: [{ n: '구동축', t: 'rot' }], outs: [{ n: '종동축', t: 'rot' }],
    desc: '맞물린 두 기어입니다. 잇수 비율만큼 속도가 바뀌고, 회전 방향은 반대가 됩니다.',
    params: [{ k: 'z1', l: '구동 기어 잇수', min: 8, max: 60, step: 1, d: 20 }, { k: 'z2', l: '종동 기어 잇수', min: 8, max: 60, step: 1, d: 40 }],
    info: m => `기어비 ${m.p.z1}:${m.p.z2} → 출력 속도 ×${(m.p.z1 / m.p.z2).toFixed(2)}, 방향 반대`,
    eval: (m, [x]) => [-x * m.p.z1 / m.p.z2],
    code: (m, [x], n) => [`${n} = -${x} * ${m.p.z1}/${m.p.z2}`, `곱셈 연산: 속도 ×${(m.p.z1 / m.p.z2).toFixed(2)}, 방향 반전`],
    draw(c, m, b) {
      const { z1, z2 } = m.p, k = Math.min((b.w - 12) / (2 * (z1 + z2)), (b.h - 10) / (2 * Math.max(z1, z2)));
      const r1 = z1 * k, r2 = z2 * k, x1 = b.cx - (r1 + r2) / 2, x2 = x1 + r1 + r2;
      gear(c, x1, b.cy, r1, z1, m.inV[0] ?? 0, '#DCE6EF');
      gear(c, x2, b.cy, r2, z2, (m.outV[0] ?? 0) + 180 + 180 / z2, '#EEF2F6');
    } },

  pulley: { name: '풀리와 벨트', base: '풀리', cat: 'trans', concept: '함수 호출', ins: [{ n: '구동 풀리', t: 'rot' }], outs: [{ n: '종동 풀리', t: 'rot' }],
    desc: '벨트로 멀리 떨어진 축에 회전을 전달합니다. 방향은 그대로이고, 벨트를 엇걸면 반대가 됩니다.',
    params: [{ k: 'd1', l: '구동 풀리 지름 (mm)', min: 10, max: 80, step: 1, d: 30 }, { k: 'd2', l: '종동 풀리 지름 (mm)', min: 10, max: 80, step: 1, d: 60 }, { k: 'cross', l: '엇걸이 벨트 (방향 반전)', type: 'check', d: 0 }],
    info: m => `속도 ×${(m.p.d1 / m.p.d2).toFixed(2)}, 방향 ${m.p.cross ? '반대' : '같음'}`,
    eval: (m, [x]) => [(m.p.cross ? -1 : 1) * x * m.p.d1 / m.p.d2],
    code: (m, [x], n) => [`${n} = ${m.p.cross ? '-' : ''}${x} * ${m.p.d1}/${m.p.d2}`, `함수 호출: 벨트로 먼 축에 값 전달${m.p.cross ? ' (엇걸이: 반전)' : ''}`],
    draw(c, m, b) {
      const { d1, d2 } = m.p, k = Math.min((b.h - 8) / (2 * Math.max(d1, d2)) * 2, (b.w * 0.36) / Math.max(d1, d2));
      const r1 = d1 / 2 * k, r2 = d2 / 2 * k, x1 = b.x + 4 + r1, x2 = b.x + b.w - 4 - r2, cy = b.cy;
      c.strokeStyle = '#46505A'; c.lineWidth = 2.2; c.beginPath();
      if (m.p.cross) { c.moveTo(x1, cy - r1); c.lineTo(x2, cy + r2); c.moveTo(x1, cy + r1); c.lineTo(x2, cy - r2); }
      else { c.moveTo(x1, cy - r1); c.lineTo(x2, cy - r2); c.moveTo(x1, cy + r1); c.lineTo(x2, cy + r2); }
      c.stroke();
      [[x1, r1, m.inV[0] ?? 0], [x2, r2, m.outV[0] ?? 0]].forEach(([x, r, a]) => {
        circ(c, x, cy, r, '#E4EAF0', INK, 1.3);
        for (let j = 0; j < 3; j++) { const [px, py] = P(x, cy, r * 0.85, a * D2R + j * TAU / 3); line(c, x, cy, px, py, '#7C8894', 1.6); }
        circ(c, x, cy, 3, '#fff', INK, 1.1);
      });
    } },

  worm: { name: '웜과 웜휠', base: '웜', cat: 'trans', concept: '나눗셈 ÷', ins: [{ n: '웜 축', t: 'rot' }], outs: [{ n: '웜휠 축', t: 'rot' }],
    desc: '나사 모양의 웜이 한 바퀴 돌 때 웜휠은 한 칸만 돕니다. 속도를 크게 줄이고, 거꾸로는 돌릴 수 없습니다.',
    params: [{ k: 's', l: '웜 줄 수', min: 1, max: 3, step: 1, d: 1 }, { k: 'z', l: '웜휠 잇수', min: 10, max: 60, step: 1, d: 30 }],
    info: m => `감속비 ${m.p.z / m.p.s}:1 → 웜 ${m.p.z / m.p.s}바퀴에 웜휠 1바퀴`,
    eval: (m, [x]) => [x * m.p.s / m.p.z],
    code: (m, [x], n) => [`${n} = ${x} * ${m.p.s}/${m.p.z}`, `나눗셈: ${(m.p.z / m.p.s)}분의 1로 크게 감속`],
    draw(c, m, b) {
      const rw = Math.min(b.h * 0.34, b.w * 0.3), wy = b.y + rw + 6, yy = wy + rw + 9;
      gear(c, b.cx, wy, rw, m.p.z, m.outV[0] ?? 0, '#E4EAF0');
      c.save(); rr(c, b.x + 6, yy - 8, b.w - 12, 16, 7); c.fillStyle = '#D5DDE5'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.2; c.stroke(); c.clip();
      const pitch = 9, off = mod360(m.inV[0] ?? 0) / 360 * pitch * m.p.s;
      c.strokeStyle = '#56606B'; c.lineWidth = 1.4;
      for (let x = b.x - pitch + off; x < b.x + b.w + pitch; x += pitch) { c.beginPath(); c.moveTo(x, yy - 8); c.lineTo(x + 5, yy + 8); c.stroke(); }
      c.restore();
    } },

  crank: { name: '크랭크-슬라이더', base: '크랭크', cat: 'conv', concept: '형 변환 (회전→직선)', ins: [{ n: '크랭크 축', t: 'rot' }], outs: [{ n: '슬라이더', t: 'lin' }],
    desc: '회전을 직선 왕복으로 바꿉니다. 슬라이더가 움직이는 거리(행정)는 크랭크 반지름의 2배입니다.',
    params: [{ k: 'r', l: '크랭크 반지름 (mm)', min: 5, max: 40, step: 1, d: 15 }, { k: 'L', l: '연결봉 길이 (mm)', min: 20, max: 120, step: 1, d: 50 }],
    info: m => `행정 = 2 × ${m.p.r} = ${2 * m.p.r} mm` + (m.p.L <= m.p.r ? '<br>⚠ 연결봉이 크랭크보다 길어야 해요' : ''),
    eval: (m, [x]) => { const L = Math.max(m.p.L, m.p.r + 1); return [crankX(m.p.r, L, x) - (L - m.p.r)]; },
    code: (m, [x], n) => [`${n} = 크랭크(${x}, r=${m.p.r}, L=${m.p.L})`, `형 변환: 회전 → 직선 왕복 (0~${2 * m.p.r}mm)`],
    draw(c, m, b) {
      const r = m.p.r, L = Math.max(m.p.L, r + 1), a = m.inV[0] ?? 0;
      const sc = Math.min((b.w - 20) / (2 * r + L), (b.h / 2 - 4) / r), ox = b.x + 4 + r * sc, oy = b.cy;
      line(c, ox, oy + 9, b.x + b.w, oy + 9, '#C9D2CD', 2);
      circ(c, ox, oy, r * sc, '#E7EFE9', '#9FB3A5', 1);
      const [ax, ay] = P(ox, oy, r * sc, a * D2R), sx = ox + crankX(r, L, a) * sc;
      line(c, ox, oy, ax, ay, CAT.src.c, 4); line(c, ax, ay, sx, oy, '#56606B', 3);
      c.fillStyle = '#F6D7B8'; c.strokeStyle = INK; c.lineWidth = 1.2; c.fillRect(sx - 11, oy - 8, 22, 16); c.strokeRect(sx - 11, oy - 8, 22, 16);
      joint(c, ox, oy); joint(c, ax, ay); joint(c, sx, oy);
    } },

  fourbar: { name: '4절 링크 (크랭크-로커)', base: '링크', cat: 'conv', concept: '형 변환 (회전→요동)', ins: [{ n: '크랭크 축', t: 'rot' }], outs: [{ n: '로커 축', t: 'rot' }],
    desc: '네 개의 막대로 연속 회전을 일정 각도 사이를 오가는 흔들기(요동)로 바꿉니다.',
    params: [{ k: 'a', l: '크랭크 a (mm)', min: 5, max: 60, step: 1, d: 20 }, { k: 'b', l: '커플러 b (mm)', min: 20, max: 120, step: 1, d: 60 }, { k: 'c', l: '로커 c (mm)', min: 10, max: 100, step: 1, d: 45 }, { k: 'd', l: '고정 링크 d (mm)', min: 20, max: 120, step: 1, d: 55 }],
    info: m => { const L = [m.p.a, m.p.b, m.p.c, m.p.d], s = Math.min(...L), l = Math.max(...L), sum = L.reduce((x, y) => x + y, 0);
      const ok = s + l <= sum - s - l && m.p.a === s;
      return ok ? `✔ 크랭크-로커 조건 만족<br>가장 짧은 a(${s}) + 가장 긴 링크(${l}) ≤ 나머지 합(${sum - s - l})` : `⚠ 크랭크가 한 바퀴를 다 돌지 못할 수 있어요<br>a를 가장 짧게, (최단+최장) ≤ 나머지 두 링크 합이 되게 하세요`; },
    eval: (m, [x]) => { const s = fourbarSolve(m.p, x); if (!s) { m.warn = '링크가 끝까지 돌지 못하고 걸려요 (길이 조합 확인)'; return [m.st.last ?? null]; } m.st.sol = s; m.st.last = s.ang; return [s.ang]; },
    code: (m, [x], n) => [`${n} = 링크(${x}, a=${m.p.a}, b=${m.p.b}, c=${m.p.c}, d=${m.p.d})`, '형 변환: 연속 회전 → 요동 (흔들기)'],
    draw(c, m, b) {
      const { a, b: bb, c: cc, d } = m.p, s = m.st.sol || fourbarSolve(m.p, m.inV[0] ?? 0);
      const sc = Math.min((b.w - 14) / (a + d + cc), (b.h - 14) / (a + cc)), ox = b.x + 7 + a * sc, oy = b.y + 4 + cc * sc;
      const X = x => ox + x * sc, Y = y => oy - y * sc;
      c.setLineDash([4, 3]); line(c, ox, oy, X(d), oy, '#9AA5AE', 1.2); c.setLineDash([]);
      ground(c, ox, oy + 3); ground(c, X(d), oy + 3);
      if (s) {
        line(c, ox, oy, X(s.Ax), Y(s.Ay), CAT.src.c, 4);
        line(c, X(s.Ax), Y(s.Ay), X(s.Bx), Y(s.By), '#56606B', 3);
        line(c, X(d), oy, X(s.Bx), Y(s.By), CAT.conv.c, 5);
        joint(c, X(s.Ax), Y(s.Ay)); joint(c, X(s.Bx), Y(s.By));
      }
      joint(c, ox, oy); joint(c, X(d), oy);
    } },

  cam: { name: '캠과 종동절', base: '캠', cat: 'conv', concept: '조건문 if', ins: [{ n: '캠 축', t: 'rot' }], outs: [{ n: '종동절', t: 'lin' }],
    desc: '캠의 모양이 종동절의 움직임을 결정합니다. 돌출형은 정해진 각도 구간에서만 종동절을 들어 올립니다.',
    params: [{ k: 'shape', l: '캠 모양', type: 'select', o: [['bump', '돌출형 (조건 구간)'], ['ecc', '편심형 (부드러운 곡선)'], ['heart', '하트형 (일정 속도)'], ['snail', '달팽이형 (급강하)']], d: 'bump' },
      { k: 'H', l: '들어 올리는 높이 (mm)', min: 2, max: 30, step: 1, d: 10 }, { k: 'start', l: '돌출 시작 각도 (°)', min: 0, max: 359, step: 1, d: 60 }, { k: 'width', l: '돌출 구간 폭 (°)', min: 10, max: 300, step: 1, d: 60 }],
    info: m => m.p.shape === 'bump' ? `if ${m.p.start}° ≤ 각도 < ${m.p.start + m.p.width}° → ${m.p.H}mm 들어 올림`
      : m.p.shape === 'snail' ? '달팽이형은 한쪽 방향으로만 돌려야 해요. 거꾸로 돌리면 턱(단차)에 걸립니다.'
      : '시작 각도와 폭은 돌출형에서만 쓰여요',
    eval: (m, [x]) => {
      if (m.p.shape !== 'snail') return [camLift(m.p, x)];
      const px = m.st.prevX;
      if (px != null) {
        const dx = x - px;
        if (dx < 0) {
          const pf = mod360(px), f = mod360(x);
          if (pf < f || m.st.jammed) { // 턱을 거꾸로 넘으려는 중 (또는 이미 걸려 있음)
            if (!m.st.jammed) { m.st.jammed = true; m.st.jamAt = px; } // 턱에 닿은 각도에서 캠이 멈춘다
            m.st.prevX = x;
            m.warn = '캠이 걸렸어요 (달팽이형은 역회전에서 턱을 넘을 수 없음)';
            return [m.st.lastLift ?? 0];
          }
        } else if (dx > 0) { m.st.jammed = false; m.st.jamAt = null; } // 정방향으로 돌아오면 풀림
      }
      m.st.prevX = x; const v = camLift(m.p, x); m.st.lastLift = v; return [v];
    },
    read: m => { if (m.st.jammed) return '걸림 — 역회전 불가'; const v = m.outV[0]; return v == null ? null : `${v.toFixed(1)} mm`; },
    code: (m, [x], n) => { const p = m.p;
      if (p.shape === 'ecc') return [`${n} = ${p.H / 2} * (1 - cos(${x}))`, '곡선 함수: 부드럽게 오르내림'];
      if (p.shape === 'heart') return [`${n} = 삼각파(${x}, 높이=${p.H})`, '일정한 속도로 오르내림'];
      if (p.shape === 'snail') return [`${n} = ${p.H} * (${x} % 360) / 360`, '천천히 오르다 한 번에 떨어짐'];
      return [`${n} = ${p.H} if ${p.start} <= ${x} % 360 < ${p.start + p.width} else 0`, '조건문 if: 정해진 각도 구간에서만 들어 올림']; },
    draw(c, m, b) {
      const p = m.p, jam = !!m.st.jammed, rb = 12, sc = (b.h - 12) / (2 * (rb + p.H) + 6), cx = b.cx, cy = b.y + b.h - (rb + p.H) * sc - 2;
      const th = ((jam ? m.st.jamAt : m.inV[0]) ?? 0) * D2R; // 걸리면 캠도 그 자리에서 멈춘다
      const edge = jam ? '#B23A2E' : INK;
      c.beginPath();
      for (let al = 0; al <= 360; al += 3) { const R = (rb + camLift(p, 90 - al)) * sc; const [x, y] = P(cx, cy, R, al * D2R + th); al ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.closePath(); c.fillStyle = jam ? '#F7DEDA' : '#DCEBE1'; c.fill(); c.strokeStyle = edge; c.lineWidth = jam ? 2 : 1.2; c.stroke();
      circ(c, cx, cy, 3, '#fff', edge, 1.1); const [mx, my] = P(cx, cy, rb * sc * 0.6, th); circ(c, mx, my, 1.8, edge);
      const fy = cy - (rb + (m.outV[0] ?? 0)) * sc, fcol = jam ? '#B23A2E' : '#D9730D';
      line(c, cx - 11, b.y + 10, cx - 11, b.y + 22, '#9AA5AE', 2); line(c, cx + 11, b.y + 10, cx + 11, b.y + 22, '#9AA5AE', 2);
      line(c, cx, fy, cx, b.y - 4, fcol, 5);
      c.fillStyle = fcol; c.fillRect(cx - 9, fy - 3, 18, 3);
      if (jam) txt(c, '걸림', cx + 24, fy, 11, '#B23A2E', 'left', 700);
    } },

  geneva: { name: '제네바 기구', base: '제네바', cat: 'conv', concept: '반복문 for', ins: [{ n: '구동 핀 축', t: 'rot' }], outs: [{ n: '제네바 휠', t: 'rot' }],
    desc: '구동 핀이 홈에 들어가 있을 때만 휠이 한 칸 돌고, 나머지 시간은 멈춥니다. 연속 회전을 끊어서 한 칸씩 전달합니다.',
    params: [{ k: 'n', l: '홈 개수 (한 바퀴 칸 수)', type: 'select', o: [[3, '3칸 (120°)'], [4, '4칸 (90°)'], [5, '5칸 (72°)'], [6, '6칸 (60°)'], [8, '8칸 (45°)']], d: 4 }],
    info: m => { const n = m.p.n, move = 180 - 360 / n; return `구동축 1바퀴 = 휠 한 칸 ${(360 / n).toFixed(0)}°<br>움직이는 시간 ${(move / 360 * 100).toFixed(0)}%, 멈춘 시간 ${(100 - move / 360 * 100).toFixed(0)}%`; },
    eval: (m, [x]) => [genevaOut(m.p.n, x)],
    code: (m, [x], n) => [`${n} = -(${x} // 360) * ${Math.round(360 / m.p.n)}`, `반복문: 한 바퀴마다 i += 1 (한 칸 ${Math.round(360 / m.p.n)}°), 그 사이엔 멈춤`],
    draw(c, m, b) {
      const n = m.p.n, sn = Math.sin(Math.PI / n), co = Math.cos(Math.PI / n), a = TAU / n;
      const C = Math.min((b.w - 12) / (sn + 1 + co), (b.h - 6) / (2 * co)), r = C * sn, R = C * co;
      const dx = b.x + 6 + r, wx = dx + C, cy = b.cy, out = (m.outV[0] ?? 0) * D2R, pin = ((m.inV[0] ?? 0) - 180) * D2R;
      circ(c, wx, cy, R, '#E4EAF0', INK, 1.2);
      for (let j = 0; j < n; j++) {
        const ang = Math.PI + a / 2 + out + j * a, [x1, y1] = P(wx, cy, C - r - 4, ang), [x2, y2] = P(wx, cy, R + 2, ang);
        line(c, x1, y1, x2, y2, INK, 8); line(c, x1, y1, x2, y2, PLATE, 5.5);
      }
      circ(c, wx, cy, 3, '#fff', INK, 1.1);
      circ(c, dx, cy, r * 0.55, '#F3E3DF', INK, 1.1);
      const [px, py] = P(dx, cy, r, pin); line(c, dx, cy, px, py, CAT.src.c, 3.5); circ(c, px, py, 3.6, SEL, INK, 1.2); joint(c, dx, cy);
    } },

  rack: { name: '랙과 피니언', base: '랙', cat: 'conv', concept: '배열 인덱스 [i]', ins: [{ n: '피니언 축', t: 'rot' }], outs: [{ n: '위치', t: 'lin' }],
    desc: '피니언이 돌면서 랙 위를 따라 이동합니다. 랙을 칸으로 나누면 현재 위치를 배열의 번호처럼 읽을 수 있습니다.',
    params: [{ k: 'r', l: '피니언 반지름 (mm)', min: 5, max: 40, step: 0.1, d: 15 }, { k: 'L', l: '랙 길이 (mm)', min: 40, max: 300, step: 5, d: 120 },
      { k: 'cells', l: '칸 수 (배열 크기)', min: 1, max: 8, step: 1, d: 4 }, { k: 'start', l: '시작 위치 (mm)', min: 0, max: 300, step: 1, d: 0 }, { k: 'inv', l: '이동 방향 반전', type: 'check', d: 0 }],
    info: m => `피니언 한 바퀴 = ${(TAU * m.p.r).toFixed(1)} mm 이동<br>한 칸 = ${(m.p.L / m.p.cells).toFixed(1)} mm`,
    eval: (m, [x]) => { const v = m.p.start + (m.p.inv ? -1 : 1) * x * D2R * m.p.r; if (v < 0 || v > m.p.L) m.warn = '랙 끝에 닿았어요 (배열 범위를 벗어남, IndexError)'; return [clamp(v, 0, m.p.L)]; },
    code: (m, [x], n) => [`${n} = 제한(${m.p.start} ${m.p.inv ? '-' : '+'} 라디안(${x}) * ${m.p.r}, 0, ${m.p.L})`, `배열 인덱스: 칸 번호 i = ${n} // ${+(m.p.L / m.p.cells).toFixed(1)}`],
    read: m => { const v = m.outV[0]; if (v == null) return null; return `${v.toFixed(1)} mm  칸 [${rackIdx(m, v)}]`; },
    draw(c, m, b) {
      const p = m.p, v = m.outV[0] ?? p.start, sc = (b.w - 20) / p.L, x0 = b.x + 10, ry = b.y + b.h - 16, cw = p.L / p.cells, idx = rackIdx(m, v);
      c.fillStyle = '#FFF3C4'; c.fillRect(x0 + idx * cw * sc, b.y + 14, cw * sc, ry - b.y - 14);
      c.setLineDash([3, 3]);
      for (let i = 0; i <= p.cells; i++) { const x = x0 + i * cw * sc; line(c, x, b.y + 14, x, ry, '#B7C1C8', 1); }
      c.setLineDash([]);
      for (let i = 0; i < p.cells; i++) txt(c, `[${i}]`, x0 + (i + 0.5) * cw * sc, b.y + 7, 10, i === idx ? INK : MUTED, 'center', i === idx ? 700 : 400);
      c.fillStyle = '#D5DDE5'; c.fillRect(x0 - 4, ry, b.w - 12, 11); c.strokeStyle = INK; c.lineWidth = 1; c.strokeRect(x0 - 4, ry, b.w - 12, 11);
      c.fillStyle = '#9AA5AE'; for (let x = x0 - 2; x < x0 + b.w - 18; x += 6) { c.beginPath(); c.moveTo(x, ry); c.lineTo(x + 2, ry - 3); c.lineTo(x + 4, ry); c.fill(); }
      const pr = Math.min(15, b.h * 0.22), px = x0 + v * sc;
      gear(c, px, ry - pr - 3, pr, 12, -(v / p.r) / D2R, '#DCEBE1');
    } },

  ratchet: { name: '래칫', base: '래칫', cat: 'conv', concept: '누적 +=', ins: [{ n: '레버 축', t: 'rot' }], outs: [{ n: '래칫 휠', t: 'rot' }],

  { n: '미션 2: 풀리 + 기어 + 크랭크', d: () => build([['motor', 0, 20, { rpm: 30 }, '손잡이'], ['pulley', 220, 20, { d1: 30, d2: 30 }], ['gear', 440, 20, { z1: 12, z2: 36 }], ['crank', 660, 20], ['plot', 880, 0]], [[0, 1], [1, 2], [2, 3], [3, 4]]) },

      ['switch', 0, 0, { period: 1 }, 'A'], ['switch', 0, 180, { period: 2 }, 'B'],
      ['xor', 220, 0, {}, '합'], ['and', 220, 180, {}, '올림'], ['lamp', 440, 0, {}, 'S'], ['lamp', 440, 180, {}, 'C']],
      [[0, 2, 0], [1, 2, 1], [0, 3, 0], [1, 3, 1], [2, 4], [3, 5]]) },
  { n: '논리: 전가산기', d: () => build([
      ['switch', 0, 0, { period: 1 }, 'A'], ['switch', 0, 160, { period: 2 }, 'B'], ['switch', 0, 320, { period: 4 }, 'Cin'],
      ['xor', 220, 0, {}, 'X1'], ['and', 220, 180, {}, 'N1'], ['xor', 440, 60, {}, 'X2'], ['and', 440, 260, {}, 'N2'],
      ['or', 660, 220, {}, 'OR1'], ['lamp', 660, 40, {}, 'S'], ['lamp', 880, 220, {}, 'Cout']],
      [[0, 3, 0], [1, 3, 1], [0, 4, 0], [1, 4, 1], [3, 5, 0], [2, 5, 1], [3, 6, 0], [2, 6, 1], [4, 7, 0], [6, 7, 1], [5, 8], [7, 9]]) }
];
EXAMPLES.forEach((e, i) => { const o = document.createElement('option'); o.value = i; o.textContent = e.n; $('#exSel').appendChild(o); });
$('#exSel').onchange = e => { const i = e.target.value; if (i === '') return; loadData(EXAMPLES[+i].d()); e.target.value = ''; };

/* =====================================================================
   저장 / 불러오기
   - Apps Script 안에서 열면 서버(google.script.run)에 저장
   - GitHub Pages 등 정적 호스팅에서 열면 이 브라우저 저장소에 저장
   ===================================================================== */
function serialize() { return { v: 1, mods: mods.map(m => ({ id: m.id, type: m.type, x: m.x, y: m.y, label: m.label, p: m.p })), wires: wires.map(w => ({ from: w.from, to: w.to })) }; }
function loadData(data) {
  mods = []; wires = []; nextId = 1; sel = { kind: null };
  (data.mods || []).forEach(o => { if (DEFS[o.type]) addModule(o.type, o.x, o.y, o.p, o.label, o.id); });
  rebuild();
  (data.wires || []).forEach(w => { if (modById.has(w.from.m) && modById.has(w.to.m)) wires.push({ id: nextId++, from: w.from, to: w.to }); });
  rebuild(); resetSim(); renderProps(); fitView();
}
const hasGAS = typeof google !== 'undefined' && google.script && google.script.run;
const localApi = {
  _all() { try { return JSON.parse(localStorage.getItem('automata-designs') || '{}'); } catch (e) { return {}; } },
  _put(o) { try { localStorage.setItem('automata-designs', JSON.stringify(o)); } catch (e) { throw new Error('이 브라우저에서는 저장할 수 없어요. JSON 내보내기를 사용하세요.'); } },
  listDesigns() { const o = this._all(); return Object.keys(o).map(n => ({ name: n, savedAt: o[n].savedAt })).sort((a, b) => a.savedAt < b.savedAt ? 1 : -1); },
  saveDesign(n, j) { const o = this._all(); o[n] = { savedAt: new Date().toLocaleString('ko-KR'), data: j }; this._put(o); return this.listDesigns(); },
  loadDesign(n) { const o = this._all(); if (!o[n]) throw new Error('설계를 찾을 수 없어요.'); return o[n].data; },
  deleteDesign(n) { const o = this._all(); delete o[n]; this._put(o); return this.listDesigns(); }
};
function api(fn, ...args) {
  return new Promise((res, rej) => {
    if (hasGAS) google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
    else { try { res(localApi[fn](...args)); } catch (e) { rej(e); } }
  });
}
function openModal(title, body, buttons) {
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body; const bx = $('#mBtns'); bx.innerHTML = '';
  buttons.forEach(b => { const el = document.createElement('button'); el.textContent = b.t; if (b.primary) el.className = 'primary'; el.onclick = b.fn || closeModal; bx.appendChild(el); });
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
let currentName = '';
$('#btnSave').onclick = () => {
  if (!mods.length) return toast('저장할 모듈이 없어요.');
  const note = hasGAS ? '' : '<p class="desc">이 컴퓨터의 이 브라우저에만 저장됩니다. 다른 컴퓨터에서 이어서 하거나 제출할 때는 JSON 내보내기를 쓰세요.</p>';
  openModal('설계 저장', `${note}<input type="text" id="saveName" placeholder="예: 3반 김OO 자동분류기" value="${esc(currentName)}" maxlength="40">`, [
    { t: '취소' },
    { t: '저장', primary: true, fn: () => { const n = $('#saveName').value.trim(); if (!n) return toast('이름을 입력하세요.');
      api('saveDesign', n, JSON.stringify(serialize())).then(() => { currentName = n; closeModal(); toast(`"${n}" 저장했어요.`); }).catch(e => toast(e.message || e)); } }]);
  setTimeout(() => $('#saveName').focus(), 50);
};
function showLoad(list) {
  const body = list.length ? `<div class="dlist">${list.map((d, i) => `<div><b>${esc(d.name)}</b><small>${esc(d.savedAt || '')}</small><button data-l="${i}">불러오기</button><button data-d="${i}" class="danger">삭제</button></div>`).join('')}</div>` : '<p class="desc">저장된 설계가 없어요. 작업판에서 만든 뒤 저장을 눌러 보세요.</p>';
  openModal('저장한 설계', body, [{ t: '닫기' }]);
  $('#mBody').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const n = list[+b.dataset.l].name;
    api('loadDesign', n).then(j => { loadData(JSON.parse(j)); currentName = n; closeModal(); toast(`"${n}" 불러왔어요.`); }).catch(e => toast(e.message || e)); });
  $('#mBody').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const n = list[+b.dataset.d].name;
    if (b.dataset.sure) api('deleteDesign', n).then(showLoad).catch(e => toast(e.message || e)); else { b.dataset.sure = 1; b.textContent = '정말 삭제'; } });
}
$('#btnLoad').onclick = () => api('listDesigns').then(showLoad).catch(e => toast(e.message || e));
$('#btnJson').onclick = () => {
  openModal('JSON 내보내기 / 가져오기', `<p class="desc">아래 내용을 복사해 친구와 나누거나 선생님께 제출하세요. 받은 JSON을 붙여 넣고 적용도 됩니다.</p><textarea id="jsonBox">${esc(JSON.stringify(serialize()))}</textarea>`, [
    { t: '닫기' },
    { t: '복사', fn: () => { const t = $('#jsonBox'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('복사했어요.'), () => { document.execCommand('copy'); toast('복사했어요.'); }); } catch (e) { document.execCommand('copy'); toast('복사했어요.'); } } },
    { t: '적용', primary: true, fn: () => { try { loadData(JSON.parse($('#jsonBox').value)); closeModal(); toast('설계를 적용했어요.'); } catch (e) { toast('JSON 형식이 올바르지 않아요.'); } } }]);
};
$('#btnClear').onclick = () => openModal('모두 지우기', '<p class="desc">작업판의 모든 모듈과 연결을 지웁니다. 저장하지 않은 내용은 사라져요.</p>', [{ t: '취소' }, { t: '지우기', primary: true, fn: () => { loadData({ mods: [], wires: [] }); currentName = ''; closeModal(); } }]);

/* 상단 조작 */
function togglePlay() { running = !running; $('#btnPlay').textContent = running ? '⏸ 멈추기' : '▶ 돌리기'; }
$('#btnPlay').onclick = togglePlay;
$('#btnStep').onclick = () => { if (running) togglePlay(); stepReq = 0.1; };
$('#btnReset').onclick = resetSim;
$('#speed').oninput = e => { speed = +e.target.value; $('#speedVal').textContent = '×' + speed.toFixed(1); };
let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

/* 시작 — 주소 끝에 ?ex=3 을 붙이면 그 번호의 예제로 바로 시작합니다 */
buildPalette(); resize(); renderProps();
const exParam = parseInt(new URLSearchParams(location.search).get('ex'), 10);
loadData(EXAMPLES[Number.isInteger(exParam) && EXAMPLES[exParam] ? exParam : 6].d());
requestAnimationFrame(frame);
</script>
</body>
</html>
